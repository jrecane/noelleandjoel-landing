<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noëlle &amp; Joel</title>
<meta name="description" content="Our wedding website is coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --background: #3a3160;
    --foreground: #2f2a24;
    --accent: #065f46;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--background);
    background-image:
      linear-gradient(180deg, rgba(20, 30, 45, 0.15) 0%, rgba(20, 30, 45, 0.05) 40%, rgba(10, 15, 25, 0.35) 100%),
      url("images/glacier.jpg");
    background-size: cover, cover;
    background-position: center, center 55%;
    background-repeat: no-repeat, no-repeat;
    background-attachment: fixed, fixed;
    color: var(--foreground);
    font-family: 'Inter', sans-serif;
    text-align: center;
    padding: 24px;
  }

  main {
    max-width: 520px;
    background: rgba(250, 247, 242, 0.88);
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 12px 40px rgba(20, 12, 40, 0.25);
    backdrop-filter: blur(2px);
  }

  .eyebrow {
    margin: 0 0 12px;
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2.75rem, 8vw, 4.5rem);
    line-height: 1.1;
  }

  .tagline {
    margin: 24px 0 0;
    font-size: 17px;
    line-height: 1.6;
    color: #57534e;
  }

  .divider {
    width: 48px;
    height: 1px;
    background: var(--accent);
    opacity: 0.4;
    margin: 32px auto;
  }

  .video-wrap {
    margin-top: 28px;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 16 / 9;
    box-shadow: 0 8px 24px rgba(6, 95, 70, 0.12);
  }

  .video-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">We're getting married</p>
    <h1>Noëlle &amp; Joel</h1>
    <div class="divider"></div>
    <p class="tagline">
      Our wedding website is coming soon.<br>
      Check back for all the details — we can't wait to share them with you.
    </p>

    <div class="divider"></div>
    <p class="tagline">
      While you wait, say hello to Noëlle's favorite animal — Tuq, a rescued
      harbor seal charming visitors at the Alaska SeaLife Center in Seward.
    </p>
    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/R7MkkPvzpl0"
        title="Tuq the harbor seal at the Alaska SeaLife Center"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
  </main>
</body>
</html>
